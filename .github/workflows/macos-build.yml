name: macOS Build Trial

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }} build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            build_script: dist:mac:arm64
            artifact_name: macos-arm64-build
          - arch: x64
            runner: macos-26-intel
            build_script: dist:mac:x64
            artifact_name: macos-x64-build

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python worker dependencies
        run: python -m pip install -r python-worker/requirements.txt

      - name: Configure bundled Python source
        shell: bash
        run: |
          PYTHON_ROOT="$(python - <<'PY'
          import pathlib
          import sys
          print(pathlib.Path(sys.executable).parents[1])
          PY
          )"
          echo "PYTHON_BUNDLE_SOURCE=${PYTHON_ROOT}" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build Next.js standalone output
        run: npm run build

      - name: Build macOS ${{ matrix.arch }} package
        run: npm run ${{ matrix.build_script }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist/*macOS-${{ matrix.arch }}.dmg
            dist/*macOS-${{ matrix.arch }}.zip
